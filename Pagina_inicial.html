<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PE Integrado - Escolha a sua Squad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Favicon: logo da GESIG com fundo branco (SVG self-contained); PNG como fallback. -->
  <link rel="icon" type="image/svg+xml" href="favicon-gesig.svg">
  <link rel="icon" type="image/png" href="img/logo-gesig.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', Arial, sans-serif; }

    /* Fundo com degrade azul animado que desliza suavemente. */
    .page {
      background: linear-gradient(150deg, #0a2a66, #16438c, #1a4fa0, #2059b8, #1c4fb0);
      background-size: 320% 320%;
      animation: fundoAnimado 20s ease infinite;
      min-height: 100vh;
    }
    @keyframes fundoAnimado {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .page { animation: none; }
      .page::before, .page::after { animation: none; }
    }

    /* Orbes de luz que flutuam ao fundo, dando profundidade e movimento. */
    .page { position: relative; overflow: hidden; }
    .page::before, .page::after {
      content: ""; position: fixed; border-radius: 50%; filter: blur(70px);
      pointer-events: none; z-index: 0; opacity: 0.45;
    }
    .page::before {
      width: 42vw; height: 42vw; max-width: 480px; max-height: 480px;
      background: radial-gradient(circle, #4f9bff, transparent 70%);
      top: -8vw; left: -6vw; animation: flutuaOrbe1 18s ease-in-out infinite;
    }
    .page::after {
      width: 50vw; height: 50vw; max-width: 560px; max-height: 560px;
      background: radial-gradient(circle, #22d3ee, transparent 70%);
      bottom: -12vw; right: -8vw; animation: flutuaOrbe2 22s ease-in-out infinite;
    }
    @keyframes flutuaOrbe1{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(40px,34px); } }
    @keyframes flutuaOrbe2{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-46px,-30px); } }

    /* O conteudo fica acima dos orbes. */
    .header, .title-section, .cards-area { position: relative; z-index: 1; }

    /* HEADER */
    /* Cabecalho com altura padronizada e as duas logos centralizadas. */
    .header {
      background: #fff;
      min-height: 104px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 52px;
      box-shadow: 0 2px 12px rgba(8,25,60,0.10);
    }

    .header-logo { object-fit: contain; transition: transform .3s ease; }
    .header-logo:hover { transform: scale(1.04); }
    /* Tamanhos por logo (a GESIG e maior para equilibrar com a SAD). */
    .logo-sad { height: 64px; }
    .logo-gesig { height: 92px; }

    @media (max-width: 600px) {
      .header { gap: 24px; min-height: 84px; }
      .logo-sad { height: 46px; }
      .logo-gesig { height: 66px; }
    }

    /* TÍTULO */
    .title-section { padding: 30px 0 22px; text-align: center; }
    .title-section h1 {
      color: #fff;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 4px 18px rgba(0,0,0,0.30);
      animation: tituloEntra .7s ease both;
    }
    @keyframes tituloEntra {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* GRID DE CARDS (mesmas metricas dos cards do index) */
    .cards-area { padding: 0 20px 30px; }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 22px;
      max-width: 1040px;
      margin: 0 auto;
    }

    /* Icone da squad (SVG vindo da pasta /img, definido na tabela squads). */
    .squad-icon {
      width: 66px; height: 66px; object-fit: contain;
      transition: transform .25s ease;
      animation: balancar 3.4s ease-in-out infinite;
    }
    /* Balanco leve e continuo dos icones. */
    @keyframes balancar {
      0%,100% { transform: rotate(-4deg); }
      50%     { transform: rotate(4deg); }
    }
    .cards-grid .squad-card:nth-child(even) .squad-icon { animation-duration: 4.1s; animation-delay: .4s; }
    .cards-grid .squad-card:nth-child(3n) .squad-icon { animation-duration: 4.5s; animation-delay: .2s; }
    /* Ao passar o mouse no card, o icone para de balancar e da um leve zoom. */
    .squad-card:hover .squad-icon { animation: none; transform: scale(1.12); }

    /* Mensagem de carregamento/erro da lista de squads. */
    .squads-aviso {
      grid-column: 1 / -1;
      text-align: center;
      color: #eaf1fb;
      font-size: 14px;
      padding: 28px 0;
    }

    /* CARD - vidro fosco translucido sobre o fundo azul */
    .squad-card {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: 18px;
      padding: 26px 18px 16px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      min-height: 242px;
      box-shadow: 0 10px 32px rgba(8,25,60,0.20);
    }

    .status-badge {
      position: absolute;
      top: 10px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #555;
    }

    .dot-green {
      width: 8px;
      height: 8px;
      background: #27ae60;
      border-radius: 50%;
      display: inline-block;
    }

    .card-top { display: flex; align-items: flex-start; gap: 10px; }

    .card-icon {
      width: 66px;
      height: 66px;
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .emoji-icon { font-size: 42px; line-height: 1; }

    .card-label {
      font-size: 10px;
      color: #666;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 1px;
    }

    .card-name {
      font-size: 18px;
      font-weight: 900;
      color: #1a1a1a;
      text-transform: uppercase;
      line-height: 1.15;
    }

    .card-desc {
      font-size: 12px;
      color: #555;
      line-height: 1.35;
      margin-top: 4px;
      min-height: 16px;
    }

    .blue-line {
      height: 3px;
      background: #2176b8;
      border-radius: 999px;
      width: 60px;
      margin: 8px auto 0;
    }

    .card-bottom {
      margin-top: auto;
      padding-top: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-select {
      background: linear-gradient(135deg, #1a4fa0, #2176b8);
      border: none;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .3px;
      padding: 7px 18px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(26,79,160,.28);
    }

    /* Hover suave nos cards da grade de squads, com borda luminosa */
    .squad-card{ transition:transform .28s ease, box-shadow .28s ease, border-color .28s ease; overflow:hidden; }
    .squad-card:hover{
      transform:translateY(-8px);
      box-shadow:0 22px 48px rgba(8,25,60,.34), 0 0 0 1px rgba(255,255,255,.35);
      border-color: rgba(255,255,255,0.85);
    }

    /* Brilho diagonal que varre o card ao passar o mouse */
    .squad-card::after{
      content:""; position:absolute; top:0; left:-120%;
      width:70%; height:100%;
      background:linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
      transform:skewX(-20deg); transition:left .65s ease; pointer-events:none;
    }
    .squad-card:hover::after{ left:140%; }

    /* Hover do botao de selecionar */
    .btn-select{ transition:transform .2s ease, box-shadow .2s ease, filter .2s ease; }
    .btn-select:hover{ transform:translateY(-2px); box-shadow:0 10px 22px rgba(26,79,160,.40); filter:brightness(1.06); }

    /* MODAL DE LOGIN */
    .login-modal{
      position:fixed; inset:0; background:rgba(10,30,70,0.55);
      backdrop-filter:blur(5px);
      display:none; align-items:center; justify-content:center; z-index:999; padding:16px;
    }
    .login-modal.aberto{ display:flex; }
    .login-box{
      background:rgba(255,255,255,0.94);
      backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
      border:1px solid rgba(255,255,255,0.6);
      width:380px; max-width:100%; border-radius:18px;
      padding:26px; box-shadow:0 28px 70px rgba(10,30,70,0.45);
      animation:loginPop .26s ease;
    }
    @keyframes loginPop{ from{transform:scale(.9);opacity:0} to{transform:scale(1);opacity:1} }
    .login-box h3{ color:#1a4fa0; margin-bottom:4px; font-size:20px; }
    .login-sub{ color:#666; font-size:13px; margin-bottom:16px; }
    .login-box input{
      width:100%; padding:12px 14px; border:1px solid #cdd9ec; border-radius:8px;
      font-size:15px; outline:none; transition:.2s;
    }
    .login-box input:focus{ border-color:#1a4fa0; box-shadow:0 0 0 3px rgba(26,79,160,.12); }
    .login-erro{ color:#c0392b; font-size:13px; min-height:18px; margin:8px 2px 0; }
    .login-acoes{ display:flex; gap:10px; margin-top:14px; }
    .login-acoes button{ flex:1; padding:11px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; border:none; transition:.2s; }
    .login-cancelar{ background:#eef2f8; color:#334155; }
    .login-entrar{ background:linear-gradient(135deg,#1a4fa0,#2176b8); color:#fff; }
    .login-entrar:hover{ transform:translateY(-1px); }
    .login-entrar:disabled{ opacity:.6; cursor:wait; }

    /* Animacao de entrada em cascata dos cards de squad */
    @keyframes cardEntra{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
    .squad-card{ opacity:0; animation:cardEntra .45s ease forwards; }
    .cards-grid .squad-card:nth-child(1){ animation-delay:.04s; }
    .cards-grid .squad-card:nth-child(2){ animation-delay:.08s; }
    .cards-grid .squad-card:nth-child(3){ animation-delay:.12s; }
    .cards-grid .squad-card:nth-child(4){ animation-delay:.16s; }
    .cards-grid .squad-card:nth-child(5){ animation-delay:.20s; }
    .cards-grid .squad-card:nth-child(6){ animation-delay:.24s; }
    .cards-grid .squad-card:nth-child(7){ animation-delay:.28s; }
    .cards-grid .squad-card:nth-child(8){ animation-delay:.32s; }

    /* Respeita preferencia do usuario por menos movimento */
    @media (prefers-reduced-motion: reduce){
      .squad-card{ animation:none; opacity:1; }
      .title-section h1, .squad-icon{ animation:none; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>

<div class="page">

  <!-- HEADER -->
  <!-- Logos centralizadas. Para trocar pelas finais, basta colocar os arquivos -->
  <!-- img/logo-sad.png (esquerda) e img/logo-gesig.png (direita) na pasta /img. -->
  <!-- Enquanto nao existirem, aparece uma logo remota de placeholder (fallback). -->
  <div class="header">
    <img class="header-logo logo-sad" src="img/logo-sad.png" alt="SAD - Secretaria de Administracao"
         onerror="this.onerror=null;this.src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4-lMnUxIad0kJWOKMjgrBcI3Rd-Nx__tWbw&s'">
    <img class="header-logo logo-gesig" src="img/logo-gesig.png" alt="GESIG"
         onerror="this.onerror=null;this.src='https://www.sad.pe.gov.br/images/images/PE-Integrado.png'">
  </div>

  <!-- TÍTULO -->
  <div class="title-section">
    <h1>Escolha a sua Squad</h1>
  </div>

  <!-- CARDS -->
  <!-- Os cards das squads sao montados dinamicamente a partir da tabela "squads" -->
  <!-- do Supabase (ver montarCardsDasSquads no script ao final da pagina). -->
  <div class="cards-area">
    <div class="cards-grid" id="cardsGrid">
      <div class="squads-aviso">Carregando squads...</div>
    </div>
  </div>
</div>

<!-- Modal de autenticacao da squad -->
<div class="login-modal" id="loginModal">
  <div class="login-box">
    <h3 id="loginTitulo">Acessar squad</h3>
    <p class="login-sub" id="loginSub"></p>
    <input type="password" id="loginSenha" placeholder="Senha da squad" autocomplete="off">
    <div class="login-erro" id="loginErro"></div>
    <div class="login-acoes">
      <button class="login-cancelar" id="loginCancelar">Cancelar</button>
      <button class="login-entrar" id="loginEntrar">Entrar</button>
    </div>
  </div>
</div>

<script>
  // Squad escolhida no momento (preenchida ao clicar em Selecionar).
  let squadSelecionada = null;

  const modal   = document.getElementById("loginModal");
  const titulo  = document.getElementById("loginTitulo");
  const sub     = document.getElementById("loginSub");
  const senhaEl = document.getElementById("loginSenha");
  const erroEl  = document.getElementById("loginErro");
  const btnEntrar = document.getElementById("loginEntrar");
  const cardsGrid = document.getElementById("cardsGrid");

  // Escapa texto para uso seguro dentro de atributos HTML.
  function escapar(texto){
    return String(texto || "")
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // Monta os cards das squads lendo a tabela "squads" do Supabase.
  async function montarCardsDasSquads(){
    const { data, error } = await supabaseClient
      .from("squads")
      .select("key, nome, descricao, icone, ativo")
      .eq("ativo", true)
      .order("ordem", { ascending: true });

    if (error){
      cardsGrid.innerHTML = `<div class="squads-aviso">Nao foi possivel carregar as squads: ${escapar(error.message)}</div>`;
      return;
    }

    if (!data || !data.length){
      cardsGrid.innerHTML = `<div class="squads-aviso">Nenhuma squad cadastrada ainda.</div>`;
      return;
    }

    cardsGrid.innerHTML = data.map(squad => `
      <div class="squad-card" data-squad="${escapar(squad.key)}" data-nome="${escapar(squad.nome)}">
        <div class="status-badge"><span class="dot-green"></span> Ativo</div>
        <div class="card-icon">
          <img class="squad-icon" src="${escapar(squad.icone)}" alt="Icone da squad ${escapar(squad.nome)}"
               onerror="this.style.display='none'">
        </div>
        <div class="card-label">Squad</div>
        <div class="card-name">${escapar(squad.nome)}</div>
        <div class="card-desc">${escapar(squad.descricao || "")}</div>
        <div class="blue-line"></div>
        <div class="card-bottom"><button class="btn-select">Selecionar</button></div>
      </div>
    `).join("");

    // Religa o clique de "Selecionar" nos cards recem-criados.
    cardsGrid.querySelectorAll(".squad-card").forEach(card => {
      card.querySelector(".btn-select").addEventListener("click", () => abrirLogin(card));
    });
  }

  // Abre o modal de senha para a squad do card clicado.
  function abrirLogin(card){
    squadSelecionada = card.getAttribute("data-squad");
    titulo.textContent = "Acessar squad";
    sub.textContent = card.getAttribute("data-nome") || "";
    erroEl.textContent = "";
    senhaEl.value = "";
    modal.classList.add("aberto");
    senhaEl.focus();
  }

  function fecharLogin(){ modal.classList.remove("aberto"); }
  document.getElementById("loginCancelar").addEventListener("click", fecharLogin);
  modal.addEventListener("click", e => { if (e.target === modal) fecharLogin(); });

  // Tenta autenticar a squad com a senha digitada.
  async function entrar(){
    const senha = senhaEl.value.trim();
    if (!senha){ erroEl.textContent = "Digite a senha."; return; }

    btnEntrar.disabled = true;
    erroEl.textContent = "";

    const { error } = await supabaseClient.auth.signInWithPassword({
      email: emailDaSquad(squadSelecionada),
      password: senha,
    });

    btnEntrar.disabled = false;

    if (error){
      erroEl.textContent = "Senha incorreta. Tente novamente.";
      senhaEl.select();
      return;
    }
    window.location.href = "index.html";
  }

  btnEntrar.addEventListener("click", entrar);
  senhaEl.addEventListener("keyup", e => { if (e.key === "Enter") entrar(); });

  // Carrega as squads assim que a pagina abre.
  montarCardsDasSquads();
</script>
</body>
</html>

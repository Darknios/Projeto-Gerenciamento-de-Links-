<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portal PE Integrado</title>

<style>

/* =========================
   RESET
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   BODY
========================= */
body{
    background: linear-gradient(135deg,#003cb3,#005eff);
    min-height:100vh;
    color:#fff;
}

/* =========================
   HEADER
========================= */
header{
    width:100%;
    background:#fff;
    padding:30px 60px;

    display:flex;
    align-items:center;
    justify-content:space-between; /* LOGOS NAS PONTAS E CENTRO */

    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

/* =========================
   LOGOS
========================= */
.logo-box{
    display:flex;
    align-items:center;
    justify-content:center;

    flex:1;
}

/* LOGO ESQUERDA */
.logo-box:first-child{
    justify-content:flex-start;
}

/* LOGO CENTRO */
.logo-box:nth-child(2){
    justify-content:center;
}

/* LOGO DIREITA */
.logo-box:last-child{
    justify-content:flex-end;
}

/* TAMANHO DAS IMAGENS */
.logo-box img{
    width:220px; /* AUMENTADO */
    max-width:100%;
    object-fit:contain;

    transition:0.3s;
}

.logo-box img:hover{
    transform:scale(1.05);
}

/* AUMENTAR APENAS A LOGO CREDENCIA */
.logo-boxi:last-child img{
    width:320px;
}

/* =========================
   TÍTULO PRINCIPAL - SQUARD ARIANO SUASSUNA (adicionado conforme imagem)
========================= */
.squad-title {
    text-align: center;
    margin: 40px 0 20px 0;
}

.squad-title h1 {
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: 2px;
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    background: rgba(0,0,0,0.1);
    display: inline-block;
    padding: 0 20px 10px 20px;
    border-bottom: 4px solid #ffcc00;
    border-radius: 2px;
}

@media (max-width: 768px) {
    .squad-title h1 {
        font-size: 1.8rem;
    }
}

/* =========================
   BARRA DE PESQUISA
========================= */
.search-box{
    margin-bottom:20px;
}

.search-box input{
    width:100%;
    padding:14px 18px;

    border:none;
    border-radius:12px;

    background:#f4f7ff;

    font-size:16px;
    outline:none;

    border:2px solid transparent;

    transition:0.3s;
}

.search-box input:focus{
    border:2px solid #0047d4;
    background:#fff;
    box-shadow:0 0 10px rgba(0,71,212,0.2);
}

/* =========================
   RESPONSIVO
========================= */
@media(max-width:768px){

    header{
        flex-direction:column;
        gap:30px;
        padding:20px;
    }

    .logo-box,
    .logo-box:first-child,
    .logo-box:nth-child(2),
    .logo-box:last-child{
        justify-content:center;
    }

    .logo-box img{
        width:170px;
    }

}

/* =========================
   CONTAINER
========================= */
.container{
    width:90%;
    margin:auto;
    padding:40px 0;
}

/* =========================
   CARDS
========================= */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

.card{
    background:#fff;
    border-radius:20px;
    padding:40px 20px;
    text-align:center;
    cursor:pointer;
    transition:0.3s;
    position:relative;
    overflow:hidden;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.card img{
    width:90px;
    margin-bottom:20px;
}

.card h3{
    color:#003cb3;
    font-size:28px;
    margin-bottom:15px;
}

.linha{
    width:80px;
    height:5px;
    background:#005eff;
    border-radius:10px;
    margin:auto;
}

/* =========================
   MODAL
========================= */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-content{
    width:500px;
    max-width:95%;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    animation:animar 0.3s ease;
}

@keyframes animar{
    from{
        transform:scale(0.8);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.modal-header{
    background:#0047d4;
    color:#fff;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{
    font-size:24px;
}

.fechar{
    font-size:30px;
    cursor:pointer;
}

.modal-body{
    padding:20px;
    max-height:400px;
    overflow-y:auto;
}

.link-item{
    background:#f4f7ff;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    transition:0.3s;
}

.link-item:hover{
    background:#dfe9ff;
}

.link-item a{
    text-decoration:none;
    color:#003cb3;
    font-weight:bold;
    word-break:break-all;
}

.link-item p{
    color:#222;
    margin-bottom:5px;
}

/* =========================
   RESPONSIVO
========================= */
@media(max-width:768px){

        justify-content:center;
        gap:25px;
        text-align:center;
    }

    .logo-box{
        flex-direction:column;
        
    }

    .card h3{
        font-size:22px;
    }

}

</style>

/* =========================
   ABRIR MODAL
========================= */

function abrirModal(tipo){

    const modal = document.getElementById("modal");
    const titulo = document.getElementById("tituloModal");
    const conteudo = document.getElementById("conteudoModal");

    titulo.innerHTML = dados[tipo].titulo;

    conteudo.innerHTML = "";

    /* =====================================
       ADICIONA BARRA DE BUSCA NO TICKET
    ===================================== */
    if(tipo === "ticket"){

        conteudo.innerHTML += `
            <div class="search-box">
                <input 
                    type="text" 
                    id="buscarTicket"
                    placeholder="Buscar ticket..."
                    onkeyup="filtrarTickets()"
                >
            </div>

            <div id="listaTickets"></div>
        `;

        const listaTickets = document.getElementById("listaTickets");

        dados[tipo].links.forEach(link => {

            listaTickets.innerHTML += `
                <div class="link-item">
                    <p>${link.nome}</p>

                    <a href="${link.url}" target="_blank">
                        ${link.url}
                    </a>
                </div>
            `;

        });

    }else{

        dados[tipo].links.forEach(link => {

            conteudo.innerHTML += `
                <div class="link-item">
                    <p>${link.nome}</p>

                    <a href="${link.url}" target="_blank">
                        ${link.url}
                    </a>
                </div>
            `;

        });

    }

    modal.style.display = "flex";
}

/* =========================
   FILTRAR TICKETS
========================= */

function filtrarTickets(){

    const input = document.getElementById("buscarTicket");
    const filtro = input.value.toLowerCase();

    const itens = document.querySelectorAll("#listaTickets .link-item");

    itens.forEach(item => {

        const texto = item.innerText.toLowerCase();

        if(texto.includes(filtro)){
            item.style.display = "block";
        }else{
            item.style.display = "none";
        }

    });

}

/* =========================
   FECHAR MODAL
========================= */

function fecharModal(){
    document.getElementById("modal").style.display = "none";
}

/* =========================
   FECHAR AO CLICAR FORA
========================= */

window.onclick = function(event){

    const modal = document.getElementById("modal");

    if(event.target == modal){
        modal.style.display = "none";
    }

}

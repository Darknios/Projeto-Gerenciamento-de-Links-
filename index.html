<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portal PE Integrado</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

/* =========================
   RESET
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',Arial,Helvetica,sans-serif;
}

/* =========================
   BODY
   Fundo com degrade azul animado que desliza suavemente.
========================= */
body{
    background:linear-gradient(135deg,#001f6b,#003097,#0048d6,#005eff,#0a4fd6);
    background-size:320% 320%;
    animation:fundoAnimado 20s ease infinite;
    min-height:100vh;
    color:#fff;
}
@keyframes fundoAnimado{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}
@media (prefers-reduced-motion: reduce){
    body{ animation:none; }
}

/* =========================
   HEADER
   Cabecalho com altura padronizada e as duas logos centralizadas.
========================= */
header{
    width:100%;
    background:#fff;
    min-height:104px;
    padding:16px 24px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

/* As laterais tem o mesmo peso (flex:1) para as logos ficarem centralizadas. */
.header-lado{ flex:1; display:flex; align-items:center; }
.header-lado:last-child{ justify-content:flex-end; }
.header-logos{ display:flex; align-items:center; gap:52px; }

/* Botao de voltar para a pagina inicial. */
.btn-voltar{
    display:inline-flex; align-items:center; gap:6px;
    text-decoration:none; color:#1a4fa0;
    border:1px solid #1a4fa0; border-radius:999px;
    padding:8px 15px; font-size:13px; font-weight:600;
    background:#fff; transition:.2s ease; white-space:nowrap;
}
.btn-voltar:hover{ background:#eaf1fb; transform:translateX(-2px); }

/* =========================
   LOGOS
========================= */
.header-logo{
    object-fit:contain;
    transition:0.3s;
}

.header-logo:hover{
    transform:scale(1.04);
}

/* Tamanhos por logo (a GESIG e maior para equilibrar com a SAD). */
.logo-sad{ height:64px; }
.logo-gesig{ height:92px; }

@media(max-width:600px){
    header{ min-height:84px; padding:12px; }
    .header-logos{ gap:16px; }
    .logo-sad{ height:42px; }
    .logo-gesig{ height:58px; }
    /* No celular, o botao fica so com a seta para economizar espaco. */
    .btn-voltar span{ display:none; }
    .btn-voltar{ padding:8px; }
}

/* =========================
   TÍTULO PRINCIPAL - SQUAD ARIANO SUASSUNA (adicionado conforme imagem)
========================= */
.squad-title {
    text-align: center;
    margin:40px 0 42px 0;
}

.squad-title h1 {
    font-size:2.35rem;
    font-weight:800;
    letter-spacing:6px;
    color:#fff;
    display:inline-block;
    padding:12px 26px 14px;
    border-bottom:4px solid #f2c94c;
    border-radius:12px;
    background:rgba(255,255,255,0.10);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.18);
    border-bottom:4px solid #f2c94c;
    box-shadow:0 12px 30px rgba(0,0,0,0.20);
    text-shadow:0 3px 10px rgba(0,0,0,0.30);
    animation:tituloEntra .7s ease both;
}
@keyframes tituloEntra{
    from{ opacity:0; transform:translateY(-10px); }
    to{ opacity:1; transform:translateY(0); }
}

@media (max-width: 768px) {
    .squad-title h1 {
        font-size: 1.8rem;
    }
}

/* =========================
   BARRA DE PESQUISA
========================= */
.search-box{
    margin-bottom:14px;
}

.search-box input{
    width:100%;
    padding:12px 14px;

    border:1px solid #d8e2f3;
    border-radius:8px;

    background:#fff;

    font-size:15px;
    outline:none;

    transition:0.2s ease;
}

.search-box input:focus{
    border-color:#0b57d0;
    box-shadow:0 0 0 3px rgba(11,87,208,0.12);
}

/* =========================
   RESPONSIVO
========================= */
@media(max-width:768px){

    header{
        padding:14px 16px;
    }

    .header-logos{
        gap:24px;
    }

}

/* =========================
   CONTAINER
========================= */
.container{
    width:90%;
    margin:auto;
    padding:0 0 54px;
}

/* =========================
   CARDS
========================= */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:22px;
}

.card{
    background:rgba(255,255,255,0.90);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.55);
    border-radius:18px;
    min-height:242px;
    padding:32px 16px;
    text-align:center;
    cursor:pointer;
    transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    box-shadow:0 10px 30px rgba(8,25,60,0.18);
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 26px 50px rgba(8,25,60,0.34), 0 0 0 1px rgba(255,255,255,0.4);
    border-color:rgba(255,255,255,0.85);
}

.card img{
    width:68px;
    height:68px;
    object-fit:contain;
    padding:0;
    margin-bottom:22px;
    border-radius:0;
    background:transparent;
    box-shadow:none;
    transition:transform .3s ease;
}

.card:hover img{
    transform:scale(1.08) translateY(-2px);
}

.card h3{
    color:#003cb3;
    font-size:23px;
    font-weight:700;
    line-height:1.15;
    margin-bottom:16px;
}

.linha{
    width:62px;
    height:3px;
    background:#005eff;
    border-radius:999px;
    margin:auto;
}

/* =========================
   MODAL
========================= */
.modal{
    position:fixed;
    inset:0;
    background:rgba(6,23,52,0.58);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
    padding:16px;
    backdrop-filter:blur(8px);
}

.modal-content{
    width:620px;
    max-width:100%;
    background:rgba(255,255,255,0.96);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:18px;
    overflow:hidden;
    animation:animar 0.32s cubic-bezier(.2,.9,.3,1.2);
    border:1px solid rgba(255,255,255,0.5);
    box-shadow:0 34px 80px rgba(15,23,42,0.45);
}

@keyframes animar{
    from{
        transform:scale(0.86) translateY(12px);
        opacity:0;
    }
    to{
        transform:scale(1) translateY(0);
        opacity:1;
    }
}

.modal-header{
    background:linear-gradient(135deg,#073b8e,#0b57d0);
    color:#fff;
    padding:20px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:4px solid #f2c94c;
}

.modal-header h2{
    font-family:"Lexend","Source Sans 3",Arial,sans-serif;
    font-size:24px;
    line-height:1.2;
    letter-spacing:0;
}

.fechar{
    width:34px;
    height:34px;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:none;
    background:rgba(255,255,255,0.10);
    color:#fff;
    font-size:28px;
    line-height:1;
    cursor:pointer;
    transition:0.2s ease;
}

.fechar:hover{
    background:rgba(255,255,255,0.20);
}

.modal-body{
    padding:22px 24px 24px;
    max-height:min(74vh,610px);
    overflow-y:auto;
    background:linear-gradient(180deg,#f8fbff,#edf4fb);
}

.link-item{
    position:relative;
    background:linear-gradient(180deg,#ffffff,#fbfdff);
    border:1px solid #dfe8f6;
    border-left:4px solid #0b57d0;
    border-radius:8px;
    padding:15px 46px 15px 16px;
    margin-bottom:12px;
    transition:0.2s ease;
}

.link-item:hover{
    border-color:#a9bfdf;
    border-left-color:#f2c94c;
    box-shadow:0 12px 24px rgba(15,23,42,0.08);
}

.link-item a{
    text-decoration:none;
    color:#0644a8;
    font-weight:700;
    font-size:14px;
    word-break:break-all;
}

.link-item p{
    color:#1f2937;
    margin-bottom:6px;
    line-height:1.4;
    font-size:16px;
    font-weight:600;
}

/* =========================
   RESPONSIVO
========================= */
@media(max-width:768px){

    header{
        justify-content:center;
        gap:18px;
        text-align:center;
    }

    .logo-box,
    .logo-boxi:last-child img{
    width:320px;
    }

    .card h3{
        font-size:18px;
    }

}

@media(max-width:560px){
    .squad-title{
        margin:32px 16px 16px;
    }

    .squad-title h1{
        padding:9px 14px 12px;
    }

    .container{
        width:92%;
        padding-top:28px;
    }

    .cards{
        grid-template-columns:1fr;
        gap:16px;
    }

    .modal{
        padding:10px;
    }

    .modal-header{
        padding:18px;
    }

    .modal-header h2{
        font-size:21px;
    }

    .modal-body{
        padding:18px;
        max-height:76vh;
    }
}



/* =========================
   FORMULÁRIO ADMIN / SUPABASE
========================= */
.form-link{
    background:linear-gradient(180deg,#eef5ff,#e6efff);
    border:1px solid #9bbcff;
    border-radius:8px;
    padding:18px;
    margin-top:22px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.70),0 12px 26px rgba(11,87,208,0.08);
}

.form-link h4{
    color:#063f9f;
    margin-bottom:14px;
    font-family:"Lexend","Source Sans 3",Arial,sans-serif;
    font-size:19px;
}

.form-link input{
    width:100%;
    padding:13px 15px;
    margin-bottom:11px;
    border:1px solid #e2e8f0;
    border-radius:8px;
    outline:none;
    font-size:16px;
    background:#fff;
    color:#222;
    transition:0.2s ease;
}

.form-link input:focus{
    border-color:#0b57d0;
    box-shadow:0 0 0 3px rgba(11,87,208,0.12);
}

.btn-adicionar{
    width:100%;
    border:none;
    background:linear-gradient(135deg,#0b57d0,#07439d);
    color:#fff;
    padding:13px 15px;
    border-radius:8px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:0.2s ease;
    box-shadow:0 10px 22px rgba(11,87,208,0.22);
}

.btn-adicionar:hover{
    transform:translateY(-1px);
    box-shadow:0 14px 26px rgba(11,87,208,0.28);
}

.link-topo{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.link-topo p{
    flex:1;
}

.btn-deletar{
    border:none;
    background:transparent;
    color:#64748b;
    width:28px;
    height:28px;
    padding:0;
    border-radius:50%;
    cursor:pointer;
    font-size:22px;
    line-height:1;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    position:absolute;
    top:10px;
    right:10px;
    transition:0.2s ease;
}

.btn-deletar:hover{
    background:#fee2e2;
    color:#b91c1c;
}

.card:focus-visible,
.btn-adicionar:focus-visible,
.btn-deletar:focus-visible,
.fechar:focus-visible,
.link-item a:focus-visible{
    outline:3px solid rgba(242,201,76,0.95);
    outline-offset:3px;
}

.mensagem-status{
    color:#334155;
    background:#ffffff;
    border:1px solid #dfe8f6;
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:12px;
    font-size:14px;
    box-shadow:0 8px 18px rgba(15,23,42,0.04);
}

/* Animacao de entrada em cascata dos cards de categoria */
@keyframes cardEntra{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
.card{ opacity:0; animation:cardEntra .45s ease forwards; }
.cards .card:nth-child(1){ animation-delay:.05s; }
.cards .card:nth-child(2){ animation-delay:.10s; }
.cards .card:nth-child(3){ animation-delay:.15s; }
.cards .card:nth-child(4){ animation-delay:.20s; }
.cards .card:nth-child(5){ animation-delay:.25s; }
.cards .card:nth-child(6){ animation-delay:.30s; }
.cards .card:nth-child(7){ animation-delay:.35s; }

/* Brilho sutil ao passar o mouse sobre os cards */
.card::after{
  content:""; position:absolute; inset:0;
  background:radial-gradient(circle at 50% 0%, rgba(0,94,255,.10), transparent 70%);
  opacity:0; transition:opacity .3s ease; pointer-events:none;
}
.card:hover::after{ opacity:1; }

/* Transicao de saida animada do link ao ser excluido */
.link-item{ transition:opacity .25s ease, transform .25s ease; }
.link-item.saindo{ opacity:0; transform:translateX(12px); }

/* =========================
   MODO EDICAO DO MODAL (botao de lapis)
   Por padrao o modal mostra so a lista de links. O lapis revela as acoes de
   adicionar, editar e excluir.
========================= */
.modal-acoes{ display:flex; align-items:center; gap:8px; }

.btn-modo-edicao{
    width:34px; height:34px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    border:none; cursor:pointer; color:#fff;
    background:rgba(255,255,255,0.10); transition:0.2s ease;
}
.btn-modo-edicao:hover{ background:rgba(255,255,255,0.20); }
.btn-modo-edicao.ativo{ background:#f2c94c; color:#1f2937; }

/* Reduz o espaco a direita (o botao de excluir nao fica mais flutuando). */
.link-item{ padding-right:16px; }

/* Acoes de cada link (editar/excluir) so aparecem no modo edicao. */
.link-acoes{ display:none; gap:4px; }
.modal-body.modo-edicao .link-acoes{ display:flex; }

.btn-acao{
    border:none; background:transparent; color:#64748b;
    width:30px; height:30px; padding:0; border-radius:8px;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    transition:0.2s ease;
}
.btn-acao:hover{ background:#eef2f8; color:#0b57d0; }
.btn-acao.excluir:hover{ background:#fee2e2; color:#b91c1c; }

/* O formulario de adicionar so aparece no modo edicao. */
.form-link{ display:none; }
.modal-body.modo-edicao .form-link{ display:block; }

/* Edicao inline de um link. */
.link-item.editando{ border-left-color:#f2c94c; }
.link-edit-inputs{ display:flex; flex-direction:column; gap:8px; }
.link-edit-inputs input{
    width:100%; padding:10px 12px; border:1px solid #cdd9ec; border-radius:8px;
    font-size:14px; outline:none;
}
.link-edit-inputs input:focus{ border-color:#0b57d0; box-shadow:0 0 0 3px rgba(11,87,208,0.12); }
.link-edit-acoes{ display:flex; gap:8px; justify-content:flex-end; margin-top:4px; }
.link-edit-acoes button{
    border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer;
}
.btn-edit-salvar{ background:linear-gradient(135deg,#0b57d0,#07439d); color:#fff; }
.btn-edit-cancelar{ background:#eef2f8; color:#334155; }

/* Barra de acoes da pagina (engrenagem). */
.acoes-pagina{ display:flex; justify-content:center; margin:-22px 0 26px; }
.btn-editar-cards{
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(255,255,255,0.12); color:#fff;
    border:1px solid rgba(255,255,255,0.28); border-radius:999px;
    padding:9px 18px; font-size:13px; font-weight:600; cursor:pointer;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:.2s ease;
}
.btn-editar-cards:hover{ background:rgba(255,255,255,0.20); }
.btn-editar-cards.ativo{ background:#f2c94c; color:#1f2937; border-color:#f2c94c; }

/* No modo edicao de cards o grid mostra cards inativos esmaecidos. */
.cards.editando-cards .card.inativo{ opacity:.45; }

/* Barra de controles dentro de cada card (so no modo edicao). */
.card-controles{ display:none; }
.cards.editando-cards .card .card-controles{
    display:flex; gap:6px; align-items:center; justify-content:center;
    margin-top:14px; flex-wrap:wrap;
}
.card-controles button{
    border:none; border-radius:8px; width:32px; height:32px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    background:#eef2f8; color:#334155; transition:.2s ease;
}
.card-controles button:hover{ background:#dde6f5; color:#0b57d0; }
.card-controles .excluir:hover{ background:#fee2e2; color:#b91c1c; }

/* Switch (liga/desliga o card). */
.switch{ position:relative; display:inline-block; width:42px; height:24px; }
.switch input{ opacity:0; width:0; height:0; }
.switch span{
    position:absolute; inset:0; background:#cdd5e1; border-radius:999px; transition:.2s;
}
.switch span::before{
    content:""; position:absolute; height:18px; width:18px; left:3px; top:3px;
    background:#fff; border-radius:50%; transition:.2s;
}
.switch input:checked + span{ background:#27ae60; }
.switch input:checked + span::before{ transform:translateX(18px); }

/* No modo edicao, o card nao navega ao clicar (so os controles agem). */
.cards.editando-cards .card{ cursor:default; }

/* Cartao "Novo card". */
.card-novo{
    display:none; align-items:center; justify-content:center;
    border:2px dashed rgba(255,255,255,0.6); border-radius:18px; min-height:242px;
    color:#fff; font-weight:700; font-size:15px; cursor:pointer; background:rgba(255,255,255,0.06);
    transition:.2s ease;
}
.cards.editando-cards .card-novo{ display:flex; }
.card-novo:hover{ background:rgba(255,255,255,0.14); }

.form-card{ display:flex; flex-direction:column; gap:8px; }
.form-card label{ font-size:13px; font-weight:600; color:#334155; margin-top:6px; }
.form-card input[type=text]{
    padding:12px 14px; border:1px solid #cdd9ec; border-radius:8px; font-size:15px; outline:none;
}
.form-card input[type=text]:focus{ border-color:#0b57d0; box-shadow:0 0 0 3px rgba(11,87,208,.12); }
.card-check{ display:flex; align-items:center; gap:8px; font-weight:500; }
.card-preview{ min-height:72px; display:flex; align-items:center; }
.card-preview img{ max-width:72px; max-height:72px; object-fit:contain; }
.card-preview img:not([src]){ display:none; }

@media (prefers-reduced-motion: reduce){
    *,
    *::before,
    *::after{
        animation:none !important;
        transition:none !important;
        scroll-behavior:auto !important;
    }
}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>

<!-- =========================
     HEADER
========================= -->
<header>

    <!-- Zona esquerda: botao de voltar para a pagina inicial (selecao de squad). -->
    <div class="header-lado">
        <a href="Pagina_inicial.html" class="btn-voltar" aria-label="Voltar para a pagina inicial">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"/>
                <path d="M12 19l-7-7 7-7"/>
            </svg>
            <span>Voltar</span>
        </a>
    </div>

    <!-- Centro: as duas logos. Para trocar pelas finais, coloque -->
    <!-- img/logo-sad.png (esquerda) e img/logo-gesig.png (direita) na pasta /img. -->
    <div class="header-logos">
        <img class="header-logo logo-sad" src="img/logo-sad.png" alt="SAD - Secretaria de Administracao"
             onerror="this.onerror=null;this.src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4-lMnUxIad0kJWOKMjgrBcI3Rd-Nx__tWbw&s'">
        <img class="header-logo logo-gesig" src="img/logo-gesig.png" alt="GESIG"
             onerror="this.onerror=null;this.src='https://www.sad.pe.gov.br/images/images/PE-Integrado.png'">
    </div>

    <!-- Zona direita: vazia, so para manter as logos centralizadas. -->
    <div class="header-lado"></div>

</header>

<!-- =========================
     TITULO DA SQUAD (preenchido dinamicamente conforme a squad logada)
========================= -->
<div class="squad-title">
    <h1>SQUAD</h1>
</div>

<!-- =========================
     ACOES DA PAGINA - botao de gerenciar cards (modo de edicao de cards)
========================= -->
<div class="acoes-pagina">
    <button id="btnEditarCards" class="btn-editar-cards" onclick="alternarEdicaoCards()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Gerenciar cards</span>
    </button>
</div>

<!-- =========================
     CONTAINER
========================= -->
<div class="container">

    <!-- Os cards de categoria sao montados dinamicamente conforme as categorias -->
    <!-- habilitadas para a squad logada (ver montarCardsDeCategoria no script). -->
    <div class="cards" id="cardsCategorias">
        <div class="mensagem-status">Carregando...</div>
    </div>

</div>

<!-- =========================
     MODAL
========================= -->
<div class="modal" id="modal">

    <div class="modal-content">

        <div class="modal-header">
            <h2 id="tituloModal">Links</h2>
            <div class="modal-acoes">
                <button type="button" class="btn-modo-edicao" id="btnModoEdicao" onclick="alternarEdicao()" aria-label="Editar links" title="Editar links">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
                    </svg>
                </button>
                <button type="button" class="fechar" onclick="fecharModal()" aria-label="Fechar modal">&times;</button>
            </div>
        </div>

        <div class="modal-body" id="conteudoModal">

        </div>

    </div>

</div>

<!-- Modal de criacao/edicao de card -->
<div class="modal" id="modalCard">
    <div class="modal-content" style="width:460px">
        <div class="modal-header">
            <h2 id="tituloModalCard">Novo card</h2>
            <button type="button" class="fechar" onclick="fecharModalCard()" aria-label="Fechar">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-card">
                <label>Nome do card</label>
                <input type="text" id="cardTitulo" placeholder="Ex.: Documentos">

                <label class="card-check">
                    <input type="checkbox" id="cardBusca"> Mostrar barra de busca neste card
                </label>

                <label>Imagem do icone</label>
                <input type="file" id="cardImagem" accept="image/*">
                <div class="card-preview"><img id="cardPreview" alt=""></div>

                <div id="cardErro" class="mensagem-status" style="display:none"></div>
                <button class="btn-adicionar" id="btnSalvarCard" onclick="salvarCard()">Salvar</button>
            </div>
        </div>
    </div>
</div>

<script>

let categoriaAtual = null;
let canalTempoReal = null;
let squadAtual = null;
let modoEdicao = false;       // controla se o modal mostra as acoes de edicao
let linksAtuais = [];         // links carregados na categoria aberta (usado na edicao inline)
let categoriasAtuais = [];   // categorias (cards) da squad logada, vindas do banco
let editandoCards = false;   // modo de gestao dos cards (engrenagem)
let cardEditId = null;        // id do card em edicao; null = criando um novo

/* =========================
   MONTAR OS CARDS DE CATEGORIA
   No modo leitura mostra apenas os cards ativos, em ordem.
   No modo edicao mostra todos (ativos e inativos) com controles.
========================= */
function montarCardsDeCategoria(){
    const cards = document.getElementById("cardsCategorias");
    const lista = editandoCards ? categoriasAtuais : categoriasAtuais.filter(c => c.ativo);

    cards.classList.toggle("editando-cards", editandoCards);

    if (!lista.length && !editandoCards){
        cards.innerHTML = `<div class="mensagem-status">Nenhum card cadastrado ainda.</div>`;
        return;
    }

    let html = lista.map((cat, i) => `
        <div class="card ${cat.ativo ? "" : "inativo"}"
             ${editandoCards ? "" : `onclick="abrirModal('${escaparAtributo(cat.slug)}')"`}>
            <img src="${escaparAtributo(cat.icone)}" alt="">
            <h3>${escaparHTML((cat.titulo || "").toUpperCase())}</h3>
            <div class="linha"></div>
            <div class="card-controles">
                <label class="switch" title="Mostrar este card">
                    <input type="checkbox" ${cat.ativo ? "checked" : ""}
                           onchange="alternarAtivo(${cat.id}, this.checked)">
                    <span></span>
                </label>
                <button title="Mover para cima" onclick="moverCard(${cat.id}, -1)">&#8593;</button>
                <button title="Mover para baixo" onclick="moverCard(${cat.id}, 1)">&#8595;</button>
                <button title="Editar" onclick="abrirEdicaoCard(${cat.id})">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
                </button>
                <button class="excluir" title="Excluir" onclick="excluirCard(${cat.id})">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>
                </button>
            </div>
        </div>
    `).join("");

    html += `<div class="card-novo" onclick="abrirNovoCard()">+ Novo card</div>`;
    cards.innerHTML = html;
}

/* =========================
   MODO EDICAO DE CARDS (engrenagem)
========================= */
function alternarEdicaoCards(){
    editandoCards = !editandoCards;
    document.getElementById("btnEditarCards").classList.toggle("ativo", editandoCards);
    montarCardsDeCategoria();
}

async function alternarAtivo(id, ativo){
    const { error } = await supabaseClient
        .from("categorias")
        .update({ ativo: ativo })
        .eq("id", id);

    if (error){ alert("Erro ao atualizar o card: " + error.message); }

    const cat = categoriasAtuais.find(c => c.id === id);
    if (cat){ cat.ativo = ativo; }
    montarCardsDeCategoria();
}

// direcao: -1 (sobe) ou 1 (desce). Troca a "ordem" com o card vizinho.
async function moverCard(id, direcao){
    const ordenadas = [...categoriasAtuais].sort((a, b) => a.ordem - b.ordem);
    const idx = ordenadas.findIndex(c => c.id === id);
    const alvo = idx + direcao;
    if (idx < 0 || alvo < 0 || alvo >= ordenadas.length){ return; }

    const a = ordenadas[idx];
    const b = ordenadas[alvo];
    const ordemA = a.ordem, ordemB = b.ordem;

    const r1 = await supabaseClient.from("categorias").update({ ordem: ordemB }).eq("id", a.id);
    const r2 = await supabaseClient.from("categorias").update({ ordem: ordemA }).eq("id", b.id);

    if (r1.error || r2.error){
        alert("Erro ao reordenar: " + ((r1.error || r2.error).message));
        return;
    }

    a.ordem = ordemB; b.ordem = ordemA;
    categoriasAtuais.sort((x, y) => x.ordem - y.ordem);
    montarCardsDeCategoria();
}

/* =========================
   ABRIR MODAL
   Sempre abre em modo leitura (limpo). O botao de lapis revela a edicao.
========================= */
async function abrirModal(tipo){
    categoriaAtual = tipo;

    const modal = document.getElementById("modal");
    const titulo = document.getElementById("tituloModal");
    const conteudo = document.getElementById("conteudoModal");
    const info = categoriaPorSlug(tipo);

    titulo.textContent = info ? info.titulo : "Links";

    // Volta para o modo leitura ao abrir.
    modoEdicao = false;
    conteudo.classList.remove("modo-edicao");
    document.getElementById("btnModoEdicao").classList.remove("ativo");

    conteudo.innerHTML = `
        ${info && info.busca ? `
            <div class="search-box">
                <input
                    type="text"
                    id="buscarTicket"
                    placeholder="Buscar..."
                    onkeyup="filtrarTickets()"
                >
            </div>
        ` : ""}

        <div id="listaLinks">
            <div class="mensagem-status">Carregando links...</div>
        </div>

        <div class="form-link">
            <h4>Adicionar novo link</h4>
            <input type="text" id="novoNome" placeholder="Nome do link">
            <input type="url" id="novaUrl" placeholder="URL do link">
            <button class="btn-adicionar" onclick="adicionarLink()">Adicionar</button>
        </div>
    `;

    modal.style.display = "flex";

    await carregarLinks(tipo);
    ativarTempoReal(tipo);
}

/* =========================
   ALTERNAR MODO EDICAO (botao de lapis)
========================= */
function alternarEdicao(){
    modoEdicao = !modoEdicao;
    document.getElementById("conteudoModal").classList.toggle("modo-edicao", modoEdicao);
    document.getElementById("btnModoEdicao").classList.toggle("ativo", modoEdicao);
}

/* =========================
   CARREGAR LINKS DO SUPABASE
========================= */
async function carregarLinks(tipo){
    const listaLinks = document.getElementById("listaLinks");

    const { data, error } = await supabaseClient
        .from("links")
        .select("id, squad, categoria, nome, url, criado_em")
        .eq("squad", squadAtual)
        .eq("categoria", tipo)
        .order("id", { ascending: true });

    if(error){
        listaLinks.innerHTML = `
            <div class="mensagem-status">
                Erro ao carregar links: ${error.message}<br>
                Confira se a URL e a chave do Supabase foram colocadas no código.
            </div>
        `;
        return;
    }

    renderizarLinks(data || []);
}

/* =========================
   RENDERIZAR LINKS NA TELA
========================= */
function renderizarLinks(links){
    const listaLinks = document.getElementById("listaLinks");
    linksAtuais = links;

    if(!links.length){
        listaLinks.innerHTML = `<div class="mensagem-status">Nenhum link cadastrado ainda.</div>`;
        return;
    }

    listaLinks.innerHTML = links.map(link => `
        <div class="link-item" data-id="${link.id}">
            <div class="link-topo">
                <p>${escaparHTML(link.nome)}</p>
                <div class="link-acoes">
                    <button class="btn-acao editar" onclick="iniciarEdicao(${link.id})"
                            title="Editar" aria-label="Editar ${escaparAtributo(link.nome)}">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 20h9"/>
                            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
                        </svg>
                    </button>
                    <button class="btn-acao excluir" onclick="deletarLink(${link.id})"
                            title="Excluir" aria-label="Excluir ${escaparAtributo(link.nome)}">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18"/>
                            <path d="M8 6V4h8v2"/>
                            <path d="M6 6l1 14h10l1-14"/>
                        </svg>
                    </button>
                </div>
            </div>

            <a href="${escaparAtributo(link.url)}" target="_blank" rel="noopener noreferrer">
                ${escaparHTML(link.url)}
            </a>
        </div>
    `).join("");
}

/* =========================
   EDICAO INLINE DE UM LINK
========================= */
function iniciarEdicao(id){
    const link = linksAtuais.find(l => l.id === id);
    const item = document.querySelector(`.link-item[data-id="${id}"]`);
    if (!link || !item){ return; }

    item.classList.add("editando");
    item.innerHTML = `
        <div class="link-edit-inputs">
            <input id="editNome-${id}" type="text" value="${escaparAtributo(link.nome)}" placeholder="Nome do link">
            <input id="editUrl-${id}" type="url" value="${escaparAtributo(link.url)}" placeholder="URL do link">
            <div class="link-edit-acoes">
                <button class="btn-edit-cancelar" onclick="cancelarEdicao()">Cancelar</button>
                <button class="btn-edit-salvar" onclick="salvarEdicao(${id})">Salvar</button>
            </div>
        </div>
    `;
}

function cancelarEdicao(){
    carregarLinks(categoriaAtual);
}

async function salvarEdicao(id){
    const nome = document.getElementById(`editNome-${id}`).value.trim();
    const url = document.getElementById(`editUrl-${id}`).value.trim();

    if(!nome || !url){
        alert("Preencha o nome e a URL do link.");
        return;
    }

    if(!url.startsWith("http://") && !url.startsWith("https://")){
        alert("A URL precisa comecar com http:// ou https://");
        return;
    }

    const { error } = await supabaseClient
        .from("links")
        .update({ nome: nome, url: url })
        .eq("id", id);

    if(error){
        alert("Erro ao salvar o link: " + error.message);
        return;
    }

    await carregarLinks(categoriaAtual);
}

/* =========================
   ADICIONAR LINK
========================= */
async function adicionarLink(){
    const nomeInput = document.getElementById("novoNome");
    const urlInput = document.getElementById("novaUrl");

    const nome = nomeInput.value.trim();
    const url = urlInput.value.trim();

    if(!nome || !url){
        alert("Preencha o nome e a URL do link.");
        return;
    }

    if(!url.startsWith("http://") && !url.startsWith("https://")){
        alert("A URL precisa começar com http:// ou https://");
        return;
    }

    const { error } = await supabaseClient
        .from("links")
        .insert({
            squad: squadAtual,
            categoria: categoriaAtual,
            nome: nome,
            url: url
        });

    if(error){
        alert("Erro ao adicionar link: " + error.message);
        return;
    }

    nomeInput.value = "";
    urlInput.value = "";

    await carregarLinks(categoriaAtual);
}

/* =========================
   DELETAR LINK
========================= */
async function deletarLink(id){
    const confirmar = confirm("Tem certeza que deseja excluir este link?");

    if(!confirmar){
        return;
    }

    // Marca o item para animar a saida antes de remover de fato.
    const item = document.querySelector(`.link-item[data-id="${id}"]`);
    if (item) item.classList.add("saindo");

    const { error } = await supabaseClient
        .from("links")
        .delete()
        .eq("id", id);

    if(error){
        alert("Erro ao excluir link: " + error.message);
        return;
    }

    await carregarLinks(categoriaAtual);
}

/* =========================
   TEMPO REAL
   Quando alguém adiciona ou exclui, quem estiver com o modal aberto atualiza também.
========================= */
function ativarTempoReal(tipo){
    if(canalTempoReal){
        supabaseClient.removeChannel(canalTempoReal);
    }

    canalTempoReal = supabaseClient
        .channel("links-" + squadAtual + "-" + tipo)
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "links",
                filter: "squad=eq." + squadAtual
            },
            (payload) => {
                // Verifica se a mudanca e da categoria que esta sendo visualizada
                const cat = (payload.new && payload.new.categoria) || (payload.old && payload.old.categoria);
                if (cat === tipo) carregarLinks(tipo);
            }
        )
        .subscribe();
}

/* =========================
   FILTRAR TICKETS
========================= */
function filtrarTickets(){
    const input = document.getElementById("buscarTicket");

    if(!input){
        return;
    }

    const filtro = input.value.toLowerCase();
    const itens = document.querySelectorAll("#listaLinks .link-item");

    itens.forEach(item => {
        const texto = item.innerText.toLowerCase();
        item.style.display = texto.includes(filtro) ? "block" : "none";
    });
}

/* =========================
   FECHAR MODAL
========================= */
function fecharModal(){
    document.getElementById("modal").style.display = "none";

    // Sai do modo edicao ao fechar.
    modoEdicao = false;
    document.getElementById("conteudoModal").classList.remove("modo-edicao");
    document.getElementById("btnModoEdicao").classList.remove("ativo");

    if(canalTempoReal){
        supabaseClient.removeChannel(canalTempoReal);
        canalTempoReal = null;
    }
}

/* =========================
   FECHAR AO CLICAR FORA
========================= */
window.onclick = function(event){
    const modal = document.getElementById("modal");

    if(event.target == modal){
        fecharModal();
    }
};

/* =========================
   SEGURANÇA CONTRA HTML INJETADO
========================= */
function escaparHTML(texto){
    const div = document.createElement("div");
    div.innerText = texto || "";
    return div.innerHTML;
}

function escaparAtributo(texto){
    return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

/* =========================
   CARREGAR CATEGORIAS (CARDS) DA SQUAD
========================= */
async function carregarCategorias(){
    const { data, error } = await supabaseClient
        .from("categorias")
        .select("id, squad, slug, titulo, icone, busca, ordem, ativo")
        .eq("squad", squadAtual)
        .order("ordem", { ascending: true });

    if (error){
        document.getElementById("cardsCategorias").innerHTML =
            `<div class="mensagem-status">Erro ao carregar os cards: ${escaparHTML(error.message)}</div>`;
        categoriasAtuais = [];
        return;
    }

    categoriasAtuais = data || [];
    montarCardsDeCategoria();
}

// Helper: acha uma categoria carregada pelo slug.
function categoriaPorSlug(slug){
    return categoriasAtuais.find(c => c.slug === slug) || null;
}

/* =========================
   CRIAR / EDITAR CARD
========================= */
function abrirNovoCard(){
    cardEditId = null;
    document.getElementById("tituloModalCard").textContent = "Novo card";
    document.getElementById("cardTitulo").value = "";
    document.getElementById("cardBusca").checked = false;
    document.getElementById("cardImagem").value = "";
    document.getElementById("cardPreview").removeAttribute("src");
    document.getElementById("cardErro").style.display = "none";
    document.getElementById("modalCard").style.display = "flex";
}

function abrirEdicaoCard(id){
    const cat = categoriasAtuais.find(c => c.id === id);
    if (!cat){ return; }
    cardEditId = id;
    document.getElementById("tituloModalCard").textContent = "Editar card";
    document.getElementById("cardTitulo").value = cat.titulo || "";
    document.getElementById("cardBusca").checked = !!cat.busca;
    document.getElementById("cardImagem").value = "";
    const prev = document.getElementById("cardPreview");
    if (cat.icone){ prev.src = cat.icone; } else { prev.removeAttribute("src"); }
    document.getElementById("cardErro").style.display = "none";
    document.getElementById("modalCard").style.display = "flex";
}

function fecharModalCard(){
    document.getElementById("modalCard").style.display = "none";
}

function previewCard(input){
    const img = document.getElementById("cardPreview");
    const file = input.files && input.files[0];
    if (!file){ img.removeAttribute("src"); return; }
    img.src = URL.createObjectURL(file);
}

function mostrarErroCard(msg){
    const el = document.getElementById("cardErro");
    el.textContent = msg;
    el.style.display = "block";
}

// Liga o preview ao seletor de arquivo (o script roda no fim do body, o elemento existe).
document.getElementById("cardImagem").addEventListener("change", e => previewCard(e.target));

// Sobe a imagem para o bucket "icones" na pasta da squad e devolve a URL publica.
async function uploadIcone(file){
    const ext = (file.name.split(".").pop() || "png").toLowerCase();
    const caminho = `${squadAtual}/${Date.now()}.${ext}`;

    const { error } = await supabaseClient
        .storage.from("icones")
        .upload(caminho, file, { upsert: true });

    if (error){ throw error; }

    const { data } = supabaseClient.storage.from("icones").getPublicUrl(caminho);
    return data.publicUrl;
}

async function salvarCard(){
    const titulo = document.getElementById("cardTitulo").value.trim();
    const busca = document.getElementById("cardBusca").checked;
    const fileInput = document.getElementById("cardImagem");
    const file = fileInput.files && fileInput.files[0];

    if (!titulo){ mostrarErroCard("Digite o nome do card."); return; }

    const btn = document.getElementById("btnSalvarCard");
    btn.disabled = true;

    try {
        let iconeUrl = null;
        if (file){
            if (!file.type.startsWith("image/")){ throw new Error("Selecione um arquivo de imagem."); }
            if (file.size > 1024 * 1024){ throw new Error("Imagem muito grande (max 1 MB)."); }
            iconeUrl = await uploadIcone(file);
        }

        if (cardEditId === null){
            const ordem = categoriasAtuais.length
                ? Math.max(...categoriasAtuais.map(c => c.ordem)) + 1 : 1;
            const { error } = await supabaseClient.from("categorias").insert({
                squad: squadAtual,
                slug: "c" + Date.now(),
                titulo: titulo,
                busca: busca,
                ordem: ordem,
                ativo: true,
                icone: iconeUrl || "https://cdn-icons-png.flaticon.com/512/1828/1828911.png"
            });
            if (error){ throw error; }
        } else {
            const update = { titulo: titulo, busca: busca };
            if (iconeUrl){ update.icone = iconeUrl; }
            const { error } = await supabaseClient.from("categorias").update(update).eq("id", cardEditId);
            if (error){ throw error; }
        }

        fecharModalCard();
        await carregarCategorias();
    } catch (e){
        mostrarErroCard("Erro ao salvar: " + e.message);
    } finally {
        btn.disabled = false;
    }
}

async function excluirCard(id){
    const cat = categoriasAtuais.find(c => c.id === id);
    if (!cat){ return; }

    const ok = confirm(`Excluir o card "${cat.titulo}"? Isso tambem apaga todos os links dentro dele.`);
    if (!ok){ return; }

    const del1 = await supabaseClient
        .from("links").delete()
        .eq("squad", squadAtual).eq("categoria", cat.slug);
    if (del1.error){ alert("Erro ao excluir os links do card: " + del1.error.message); return; }

    const del2 = await supabaseClient.from("categorias").delete().eq("id", id);
    if (del2.error){ alert("Erro ao excluir o card: " + del2.error.message); return; }

    await carregarCategorias();
}

/* =========================
   INICIALIZACAO + PROTECAO DE ACESSO
========================= */
async function iniciarPagina(){
  const { data: { session } } = await supabaseClient.auth.getSession();

  // Sem login, volta para a tela de selecao.
  if (!session){
    window.location.href = "Pagina_inicial.html";
    return;
  }

  squadAtual = squadDoEmail(session.user.email);

  // Busca os dados da squad logada (nome e categorias habilitadas).
  const { data: squad, error } = await supabaseClient
    .from("squads")
    .select("nome, categorias")
    .eq("key", squadAtual)
    .single();

  const nome = (squad && squad.nome) ? squad.nome : squadAtual;
  const tituloSquad = document.querySelector(".squad-title h1");
  if (tituloSquad){
    tituloSquad.textContent = "SQUAD - " + nome.toUpperCase();
  }

  if (error || !squad){
    document.getElementById("cardsCategorias").innerHTML =
      `<div class="mensagem-status">Nao foi possivel carregar as categorias desta squad.</div>`;
    return;
  }

  await carregarCategorias();
}

iniciarPagina();

</script>

</body>
</html>

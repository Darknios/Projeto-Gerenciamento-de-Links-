<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portal PE Integrado</title>

<style>

/* =========================
   RESET
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   BODY
========================= */
body{
    background:linear-gradient(135deg,#003cb3,#005eff);
    min-height:100vh;
    color:#fff;
}

/* =========================
   HEADER
========================= */
header{
    width:100%;
    background:#fff;
    padding:42px 64px;

    display:flex;
    align-items:center;
    justify-content:space-between; /* LOGOS NAS PONTAS E CENTRO */

    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

/* =========================
   LOGOS
========================= */
.logo-box,
.logo-boxi{
    display:flex;
    align-items:center;
    justify-content:center;

    flex:1;
}

/* LOGO ESQUERDA */
.logo-box:first-child{
    justify-content:flex-start;
}

/* LOGO CENTRO */
.logo-box:nth-child(2){
    justify-content:center;
}

.logo-boxi{
    justify-content:center;
}

/* LOGO DIREITA */
.logo-box:last-child{
    justify-content:flex-end;
}

/* TAMANHO DAS IMAGENS */
.logo-box img,
.logo-boxi img{
    width:170px;
    max-width:100%;
    object-fit:contain;

    transition:0.3s;
}

.logo-box img:hover,
.logo-boxi img:hover{
    transform:scale(1.05);
}

/* AUMENTAR APENAS A LOGO PE INTEGRADO */
.logo-boxi img{
    width:150px;
}

/* =========================
   TÍTULO PRINCIPAL - SQUARD ARIANO SUASSUNA (adicionado conforme imagem)
========================= */
.squad-title {
    text-align: center;
    margin:40px 0 42px 0;
}

.squad-title h1 {
    font-size:2.35rem;
    font-weight:800;
    letter-spacing:6px;
    color:#fff;
    display:inline-block;
    padding:8px 18px 12px;
    border-bottom:4px solid #f2c94c;
    border-radius:2px;
    background:rgba(0,45,150,0.28);
    text-shadow:0 3px 8px rgba(0,0,0,0.25);
}

@media (max-width: 768px) {
    .squad-title h1 {
        font-size: 1.8rem;
    }
}

/* =========================
   BARRA DE PESQUISA
========================= */
.search-box{
    margin-bottom:14px;
}

.search-box input{
    width:100%;
    padding:12px 14px;

    border:1px solid #d8e2f3;
    border-radius:8px;

    background:#fff;

    font-size:15px;
    outline:none;

    transition:0.2s ease;
}

.search-box input:focus{
    border-color:#0b57d0;
    box-shadow:0 0 0 3px rgba(11,87,208,0.12);
}

/* =========================
   RESPONSIVO
========================= */
@media(max-width:768px){

    header{
        flex-direction:column;
        gap:30px;
        padding:20px;
    }

    .logo-box,
    .logo-boxi,
    .logo-box:first-child,
    .logo-box:nth-child(2),
    .logo-box:last-child{
        justify-content:center;
    }

    .logo-box img,
    .logo-boxi img{
        width:190px;
        height:50px;
    }

}

/* =========================
   CONTAINER
========================= */
.container{
    width:90%;
    margin:auto;
    padding:0 0 54px;
}

/* =========================
   CARDS
========================= */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:22px;
}

.card{
    background:#fff;
    border:none;
    border-radius:14px;
    min-height:242px;
    padding:32px 16px;
    text-align:center;
    cursor:pointer;
    transition:0.3s;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.card img{
    width:68px;
    height:68px;
    object-fit:contain;
    padding:0;
    margin-bottom:22px;
    border-radius:0;
    background:transparent;
    box-shadow:none;
    transition:0.3s;
}

.card h3{
    color:#003cb3;
    font-size:23px;
    font-weight:700;
    line-height:1.15;
    margin-bottom:16px;
}

.linha{
    width:62px;
    height:3px;
    background:#005eff;
    border-radius:999px;
    margin:auto;
}

/* =========================
   MODAL
========================= */
.modal{
    position:fixed;
    inset:0;
    background:rgba(6,23,52,0.58);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
    padding:16px;
    backdrop-filter:blur(6px);
}

.modal-content{
    width:620px;
    max-width:100%;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    animation:animar 0.3s ease;
    border:1px solid rgba(255,255,255,0.22);
    box-shadow:0 28px 70px rgba(15,23,42,0.34);
}

@keyframes animar{
    from{
        transform:scale(0.8);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.modal-header{
    background:linear-gradient(135deg,#073b8e,#0b57d0);
    color:#fff;
    padding:20px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:4px solid #f2c94c;
}

.modal-header h2{
    font-family:"Lexend","Source Sans 3",Arial,sans-serif;
    font-size:24px;
    line-height:1.2;
    letter-spacing:0;
}

.fechar{
    width:34px;
    height:34px;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:none;
    background:rgba(255,255,255,0.10);
    color:#fff;
    font-size:28px;
    line-height:1;
    cursor:pointer;
    transition:0.2s ease;
}

.fechar:hover{
    background:rgba(255,255,255,0.20);
}

.modal-body{
    padding:22px 24px 24px;
    max-height:min(74vh,610px);
    overflow-y:auto;
    background:linear-gradient(180deg,#f8fbff,#edf4fb);
}

.link-item{
    position:relative;
    background:linear-gradient(180deg,#ffffff,#fbfdff);
    border:1px solid #dfe8f6;
    border-left:4px solid #0b57d0;
    border-radius:8px;
    padding:15px 46px 15px 16px;
    margin-bottom:12px;
    transition:0.2s ease;
}

.link-item:hover{
    border-color:#a9bfdf;
    border-left-color:#f2c94c;
    box-shadow:0 12px 24px rgba(15,23,42,0.08);
}

.link-item a{
    text-decoration:none;
    color:#0644a8;
    font-weight:700;
    font-size:14px;
    word-break:break-all;
}

.link-item p{
    color:#1f2937;
    margin-bottom:6px;
    line-height:1.4;
    font-size:16px;
    font-weight:600;
}

/* =========================
   RESPONSIVO
========================= */
@media(max-width:768px){

    header{
        justify-content:center;
        gap:18px;
        text-align:center;
    }

    .logo-box,
    .logo-boxi:last-child img{
    width:320px;
    }

    .card h3{
        font-size:18px;
    }

}

@media(max-width:560px){
    .squad-title{
        margin:32px 16px 16px;
    }

    .squad-title h1{
        padding:9px 14px 12px;
    }

    .container{
        width:92%;
        padding-top:28px;
    }

    .cards{
        grid-template-columns:1fr;
        gap:16px;
    }

    .modal{
        padding:10px;
    }

    .modal-header{
        padding:18px;
    }

    .modal-header h2{
        font-size:21px;
    }

    .modal-body{
        padding:18px;
        max-height:76vh;
    }
}



/* =========================
   FORMULÁRIO ADMIN / SUPABASE
========================= */
.form-link{
    background:linear-gradient(180deg,#eef5ff,#e6efff);
    border:1px solid #9bbcff;
    border-radius:8px;
    padding:18px;
    margin-top:22px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.70),0 12px 26px rgba(11,87,208,0.08);
}

.form-link h4{
    color:#063f9f;
    margin-bottom:14px;
    font-family:"Lexend","Source Sans 3",Arial,sans-serif;
    font-size:19px;
}

.form-link input{
    width:100%;
    padding:13px 15px;
    margin-bottom:11px;
    border:1px solid #e2e8f0;
    border-radius:8px;
    outline:none;
    font-size:16px;
    background:#fff;
    color:#222;
    transition:0.2s ease;
}

.form-link input:focus{
    border-color:#0b57d0;
    box-shadow:0 0 0 3px rgba(11,87,208,0.12);
}

.btn-adicionar{
    width:100%;
    border:none;
    background:linear-gradient(135deg,#0b57d0,#07439d);
    color:#fff;
    padding:13px 15px;
    border-radius:8px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:0.2s ease;
    box-shadow:0 10px 22px rgba(11,87,208,0.22);
}

.btn-adicionar:hover{
    transform:translateY(-1px);
    box-shadow:0 14px 26px rgba(11,87,208,0.28);
}

.link-topo{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.link-topo p{
    flex:1;
}

.btn-deletar{
    border:none;
    background:transparent;
    color:#64748b;
    width:28px;
    height:28px;
    padding:0;
    border-radius:50%;
    cursor:pointer;
    font-size:22px;
    line-height:1;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    position:absolute;
    top:10px;
    right:10px;
    transition:0.2s ease;
}

.btn-deletar:hover{
    background:#fee2e2;
    color:#b91c1c;
}

.card:focus-visible,
.btn-adicionar:focus-visible,
.btn-deletar:focus-visible,
.fechar:focus-visible,
.link-item a:focus-visible{
    outline:3px solid rgba(242,201,76,0.95);
    outline-offset:3px;
}

.mensagem-status{
    color:#334155;
    background:#ffffff;
    border:1px solid #dfe8f6;
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:12px;
    font-size:14px;
    box-shadow:0 8px 18px rgba(15,23,42,0.04);
}

@media (prefers-reduced-motion: reduce){
    *,
    *::before,
    *::after{
        animation:none !important;
        transition:none !important;
        scroll-behavior:auto !important;
    }
}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- =========================
     HEADER
========================= -->
<header>

    <div class="logo-box">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4-lMnUxIad0kJWOKMjgrBcI3Rd-Nx__tWbw&s">
    </div>

    <div class="logo-boxi">
        <img src="https://www.sad.pe.gov.br/images/images/PE-Integrado.png">
    </div>

    <div class="logo-box">
        <img src="https://credencia.pe.gov.br/web/image/website/1/social_default_image?unique=d0f8554">
    </div>

</header>

<!-- =========================
     TÍTULO SQUARD - ARIANO SUASSUNA (ADICIONADO DE ACORDO COM A IMAGEM)
========================= -->
<div class="squad-title">
    <h1>SQUARD - ARIANO SUASSUNA</h1>
</div>

<!-- =========================
     CONTAINER
========================= -->
<div class="container">

    <div class="cards">

        <!-- CARD 1 -->
        <div class="card" onclick="abrirModal('reunioes')">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968552.png">
            <h3>LINKS DE REUNIÕES</h3>
            <div class="linha"></div>
        </div>

        <!-- CARD 2 -->
        <div class="card" onclick="abrirModal('planilhas')">
            <img src="https://cdn-icons-png.flaticon.com/512/732/732220.png">
            <h3>LINKS DE PLANILHAS</h3>
            <div class="linha"></div>
        </div>

        <!-- CARD 3 -->
        <div class="card" onclick="abrirModal('ticket')">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968875.png">
            <h3>TICKETS - SICX</h3>
            <div class="linha"></div>
        </div>

        <!-- CARD 4 -->
        <div class="card" onclick="abrirModal('apresentacoes')">
            <img src="https://cdn-icons-png.flaticon.com/512/3131/3131631.png">
            <h3>APRESENTAÇÕES</h3>
            <div class="linha"></div>
        </div>

        <!-- CARD 5 -->
        <div class="card" onclick="abrirModal('prototipo')">
            <img src="https://cdn-icons-png.flaticon.com/512/1055/1055687.png">
            <h3>PROTÓTIPOS</h3>
            <div class="linha"></div>
        </div>

        <!-- CARD 6 -->
        <div class="card" onclick="abrirModal('homologacao')">
            <img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png">
            <h3>AMBIENTE DE HOMOLOGAÇÕES - PERFIS</h3>
            <div class="linha"></div>
        </div>

        <!-- CARD 7 -->
        <div class="card" onclick="abrirModal('gravacao')">
            <img src="https://cdn-icons-png.flaticon.com/512/4315/4315744.png">
            <h3>GRAVAÇÕES DE REUNIÕES</h3>
            <div class="linha"></div>
        </div>

    </div>

</div>

<!-- =========================
     MODAL
========================= -->
<div class="modal" id="modal">

    <div class="modal-content">

        <div class="modal-header">
            <h2 id="tituloModal">Links</h2>
            <button type="button" class="fechar" onclick="fecharModal()" aria-label="Fechar modal">&times;</button>
        </div>

        <div class="modal-body" id="conteudoModal">

        </div>

    </div>

</div>

<script>

/* =========================
   CONFIGURAÇÃO DO SUPABASE
   Troque pelos dados do seu projeto:
   Supabase > Project Settings > API
========================= */
const SUPABASE_URL = "https://lsrdtgkmhydcstsvsrzr.supabase.co/";
const SUPABASE_ANON_KEY = "sb_publishable_VaYVzVFQ39UzrH081idygA_G2Ogsj_4";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let categoriaAtual = null;
let canalTempoReal = null;

/* =========================
   TÍTULOS DAS CATEGORIAS
========================= */
const categorias = {
    reunioes: "Links de Reuniões",
    planilhas: "Planilhas",
    ticket: "Tickets Jira",
    apresentacoes: "Apresentações",
    prototipo: "Protótipos",
    homologacao: "Ambiente de Homologação",
    gravacao: "Gravações"
};

/* =========================
   ABRIR MODAL
========================= */
async function abrirModal(tipo){
    categoriaAtual = tipo;

    const modal = document.getElementById("modal");
    const titulo = document.getElementById("tituloModal");
    const conteudo = document.getElementById("conteudoModal");

    titulo.innerHTML = categorias[tipo] || "Links";

    conteudo.innerHTML = `
        ${tipo === "ticket" ? `
            <div class="search-box">
                <input
                    type="text"
                    id="buscarTicket"
                    placeholder="Buscar ticket..."
                    onkeyup="filtrarTickets()"
                >
            </div>
        ` : ""}

        <div id="listaLinks">
            <div class="mensagem-status">Carregando links...</div>
        </div>

        <div class="form-link">
            <h4>Adicionar novo link</h4>
            <input type="text" id="novoNome" placeholder="Nome do link">
            <input type="url" id="novaUrl" placeholder="URL do link">
            <button class="btn-adicionar" onclick="adicionarLink()">Adicionar</button>
        </div>
    `;

    modal.style.display = "flex";

    await carregarLinks(tipo);
    ativarTempoReal(tipo);
}

/* =========================
   CARREGAR LINKS DO SUPABASE
========================= */
async function carregarLinks(tipo){
    const listaLinks = document.getElementById("listaLinks");

    const { data, error } = await supabaseClient
        .from("links")
        .select("id, categoria, nome, url, criado_em")
        .eq("categoria", tipo)
        .order("id", { ascending: true });

    if(error){
        listaLinks.innerHTML = `
            <div class="mensagem-status">
                Erro ao carregar links: ${error.message}<br>
                Confira se a URL e a chave do Supabase foram colocadas no código.
            </div>
        `;
        return;
    }

    renderizarLinks(data || []);
}

/* =========================
   RENDERIZAR LINKS NA TELA
========================= */
function renderizarLinks(links){
    const listaLinks = document.getElementById("listaLinks");

    if(!links.length){
        listaLinks.innerHTML = `<div class="mensagem-status">Nenhum link cadastrado ainda.</div>`;
        return;
    }

    listaLinks.innerHTML = "";

    links.forEach(link => {
        listaLinks.innerHTML += `
            <div class="link-item">
                <div class="link-topo">
                    <p>${escaparHTML(link.nome)}</p>
                    <button
                        class="btn-deletar"
                        onclick="deletarLink(${link.id})"
                        title="Excluir link"
                        aria-label="Excluir ${escaparAtributo(link.nome)}"
                    >&times;</button>
                </div>

                <a href="${escaparAtributo(link.url)}" target="_blank" rel="noopener noreferrer">
                    ${escaparHTML(link.url)}
                </a>
            </div>
        `;
    });
}

/* =========================
   ADICIONAR LINK
========================= */
async function adicionarLink(){
    const nomeInput = document.getElementById("novoNome");
    const urlInput = document.getElementById("novaUrl");

    const nome = nomeInput.value.trim();
    const url = urlInput.value.trim();

    if(!nome || !url){
        alert("Preencha o nome e a URL do link.");
        return;
    }

    if(!url.startsWith("http://") && !url.startsWith("https://")){
        alert("A URL precisa começar com http:// ou https://");
        return;
    }

    const { error } = await supabaseClient
        .from("links")
        .insert({
            categoria: categoriaAtual,
            nome: nome,
            url: url
        });

    if(error){
        alert("Erro ao adicionar link: " + error.message);
        return;
    }

    nomeInput.value = "";
    urlInput.value = "";

    await carregarLinks(categoriaAtual);
}

/* =========================
   DELETAR LINK
========================= */
async function deletarLink(id){
    const confirmar = confirm("Tem certeza que deseja excluir este link?");

    if(!confirmar){
        return;
    }

    const { error } = await supabaseClient
        .from("links")
        .delete()
        .eq("id", id);

    if(error){
        alert("Erro ao excluir link: " + error.message);
        return;
    }

    await carregarLinks(categoriaAtual);
}

/* =========================
   TEMPO REAL
   Quando alguém adiciona ou exclui, quem estiver com o modal aberto atualiza também.
========================= */
function ativarTempoReal(tipo){
    if(canalTempoReal){
        supabaseClient.removeChannel(canalTempoReal);
    }

    canalTempoReal = supabaseClient
        .channel("links-" + tipo)
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "links",
                filter: "categoria=eq." + tipo
            },
            () => carregarLinks(tipo)
        )
        .subscribe();
}

/* =========================
   FILTRAR TICKETS
========================= */
function filtrarTickets(){
    const input = document.getElementById("buscarTicket");

    if(!input){
        return;
    }

    const filtro = input.value.toLowerCase();
    const itens = document.querySelectorAll("#listaLinks .link-item");

    itens.forEach(item => {
        const texto = item.innerText.toLowerCase();
        item.style.display = texto.includes(filtro) ? "block" : "none";
    });
}

/* =========================
   FECHAR MODAL
========================= */
function fecharModal(){
    document.getElementById("modal").style.display = "none";

    if(canalTempoReal){
        supabaseClient.removeChannel(canalTempoReal);
        canalTempoReal = null;
    }
}

/* =========================
   FECHAR AO CLICAR FORA
========================= */
window.onclick = function(event){
    const modal = document.getElementById("modal");

    if(event.target == modal){
        fecharModal();
    }
};

/* =========================
   SEGURANÇA CONTRA HTML INJETADO
========================= */
function escaparHTML(texto){
    const div = document.createElement("div");
    div.innerText = texto || "";
    return div.innerHTML;
}

function escaparAtributo(texto){
    return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

</script>

</body>

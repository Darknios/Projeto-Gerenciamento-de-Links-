<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Squad Lia de Itamaraca</title>
  <desc id="d">Roda de ciranda, simbolizando a danca, a uniao e a tradicao cirandeira.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7AB829"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#g)"/>
  <!-- Maos dadas (roda) -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="#fff" stroke-width="18"/>
  <!-- Pescocos ligando cada pessoa a roda -->
  <g stroke="#fff" stroke-width="16" stroke-linecap="round">
    <line x1="256" y1="160" x2="256" y2="106"/>
    <line x1="324" y1="188" x2="362" y2="150"/>
    <line x1="352" y1="256" x2="406" y2="256"/>
    <line x1="324" y1="324" x2="362" y2="362"/>
    <line x1="256" y1="352" x2="256" y2="406"/>
    <line x1="188" y1="324" x2="150" y2="362"/>
    <line x1="160" y1="256" x2="106" y2="256"/>
    <line x1="188" y1="188" x2="150" y2="150"/>
  </g>
  <!-- Cabecas das pessoas -->
  <g fill="#fff">
    <circle cx="256" cy="106" r="26"/>
    <circle cx="362" cy="150" r="26"/>
    <circle cx="406" cy="256" r="26"/>
    <circle cx="362" cy="362" r="26"/>
    <circle cx="256" cy="406" r="26"/>
    <circle cx="150" cy="362" r="26"/>
    <circle cx="106" cy="256" r="26"/>
    <circle cx="150" cy="150" r="26"/>
  </g>
</svg>
